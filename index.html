<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de sesión</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .loginBox {
        background: white;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 320px;
      }

      h1 {
        margin-top: 0;
        text-align: center;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }

      input {
        padding: 0.7rem;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      button {
        padding: 0.8rem;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="loginBox">
      <h1>Iniciar sesión</h1>
      <form action="/login" method="post">
        <input type="text" name="userName" placeholder="Usuario" required />
        <input type="password" name="password" placeholder="Contraseña" required />
        <button type="submit">Entrar</button>
      </form>
    </div>
  </body>
</html>
